<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    .line {
      stroke: #fff;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: draw 0.7s ease-out forwards;
    }
    .line:nth-child(2) { animation-delay: 0.25s; }
    .line:nth-child(3) { animation-delay: 0.5s; }
    .line:nth-child(4) { animation-delay: 0.75s; }
    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }
  </style>
  <path class="line" d="M35 12 23 88" />
  <path class="line" d="M68 12 56 88" />
  <path class="line" d="M15 40h72" />
  <path class="line" d="M10 65h72" />
</svg>
